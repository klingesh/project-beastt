name: tests

# The branch this project actually develops on, plus pull requests into it.
on:
  push:
    branches: [feat/beastt-ai-companion, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what the laptop this actually runs on has installed, so it is
        # the version that matters most; the older ones are for anyone else.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the suite
        run: pytest

  bare:
    # The suite covers pure functions only, so it must run with nothing
    # installed but pytest. This job is what stops a network dependency
    # quietly creeping into a test: tests/conftest.py stubs `requests` when it
    # is genuinely absent, and the stub raises on any actual request.
    name: pytest with no dependencies installed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Confirm requests really is absent
        run: |
          if python -c "import requests" 2>/dev/null; then
            echo "requests is installed; this job proves nothing" >&2
            exit 1
          fi

      - name: Run the suite
        run: pytest

  configured:
    # CI runs with an empty environment, so a test that reads a live Config()
    # default passes here and fails on any machine that has set that value. That
    # is not hypothetical: `assert Config().wake_console is False` was green on
    # every job above and failed immediately for the user who had been told to
    # switch the setting on.
    #
    # So one job runs the suite with settings actually configured. The values are
    # deliberately non-default -- a job that sets everything to its default would
    # prove nothing.
    name: pytest with settings configured
    runs-on: ubuntu-latest

    env:
      BEASTT_NAME: Jarvis
      BEASTT_USER_NAME: Lingaa
      BEASTT_MODEL: llama3.1:8b
      BEASTT_ON_WAKE: ui
      BEASTT_WAKE_CONSOLE: "on"
      BEASTT_UI_PORT: "9100"
      BEASTT_WAKE_MODEL: base
      BEASTT_STT_MODEL: small
      BEASTT_VOICE: "on"
      BEASTT_SEARCH_READ_PAGES: "1"
      BEASTT_VERIFY: "off"
      BEASTT_QUOTES: "off"
      BEASTT_DOC_THEME: plum
      BEASTT_IMAGE_GEN: "on"
      BEASTT_SHELL: "on"
      BEASTT_MAX_HISTORY: "8"
      BEASTT_MEMORY_RECALL: "3"
      BEASTT_TIMEOUT: "60"
      BEASTT_BOT_STALE_MINUTES: "30"
      # A key-shaped value, not a real one: enough to make a provider look
      # configured, which is what leaked into the fixtures the first time.
      BEASTT_GROQ_KEY: ci-not-a-real-key
      BEASTT_FRED_KEY: ci-not-a-real-key
      BEASTT_GITHUB_TOKEN: ci-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the suite
        run: pytest

  syntax:
    name: byte-compile every module
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        # Catches a syntax error in a module no test imports -- which matters
        # more than usual here, because selfupdate.py overwrites the running
        # source from this branch.
        run: python -m compileall -q beastt main.py update.py
