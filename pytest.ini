[pytest]
# The suite deliberately targets pure functions, so it needs no network, no
# Ollama, no API keys and no optional packages. It should run in well under a
# second -- that is the point of having made these decisions pure.
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    known_gap: locks in behaviour that is wrong but not yet fixed, so a fix is noticed.
